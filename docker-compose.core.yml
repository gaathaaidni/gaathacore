services:
  core-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${CORE_POSTGRES_DB:-gaathacore_core}
      POSTGRES_USER: ${CORE_POSTGRES_USER:-core_local}
      POSTGRES_PASSWORD: ${CORE_POSTGRES_PASSWORD:-core_local_dev_only}
    ports:
      - "127.0.0.1:${CORE_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - core-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  core-postgres-data: