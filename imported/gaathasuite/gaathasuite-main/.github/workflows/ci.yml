name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install backend lint dependencies
        run: |
          pip install ruff
      - name: Run backend linter (Ruff)
        run: |
          ruff check backend/
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install frontend dependencies
        run: npm install --prefix frontend
      - name: Run frontend linter (ESLint)
        run: npm run lint --prefix frontend

  tests:
    runs-on: ubuntu-latest
    # Add a service container for PostgreSQL to run tests against a real database
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: gaatha
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: gaatha_test
        ports:
          - 5432:5432
        # Health check to wait for Postgres to be ready
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # This now connects to the Postgres service container
      DATABASE_URL: postgresql+asyncpg://gaatha:changeme@localhost:5432/gaatha_test
      TEST_DATABASE_URL: postgresql+asyncpg://gaatha:changeme@localhost:5432/gaatha_test
      SECRET_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install PostgreSQL client libraries
        run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest-cov
      - name: Run database migrations
        run: cd backend && alembic -c migrations/alembic.ini upgrade head
      - name: Run tests and generate coverage report
        run: pytest --cov=backend --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          # For private repos, set CODECOV_TOKEN in repository secrets
          # token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install frontend dependencies
        run: npm install --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend

  build-and-push:
    # This job runs only on pushes to the main branch, not on pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [lint, tests] # Only run if linting and tests pass
    permissions:
      contents: read
      packages: write # Required to push to GitHub Container Registry

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/gaathasuite:latest
