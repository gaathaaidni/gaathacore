name: Secret key check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install python-dotenv
      - name: Run secret check
        run: python scripts/check_secret.py
        env:
          # If you want CI to validate a real secret, set SECRET_KEY in repo secrets
          SECRET_KEY: ${{ secrets.SECRET_KEY }}

  secret-leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan repository for committed SECRET_KEY values
        run: |
          set -euo pipefail
          # search for SECRET_KEY= in tracked files, excluding common ignored locations
          if git grep -n --line-number --untracked --full-name "SECRET_KEY=" -- ':!*.env' ':!instance/*' >/dev/null 2>&1; then
            echo "ERROR: Found possible committed SECRET_KEY in repository (see below)"
            git grep -n --line-number --untracked --full-name "SECRET_KEY=" -- ':!*.env' ':!instance/*' || true
            exit 1
          fi
          echo "No committed SECRET_KEY occurrences found."
