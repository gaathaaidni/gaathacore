{% extends 'base.html' %}
{% block content %}
<div class="container">
  <h3>Invitation to join {{ invite.organization.name }}</h3>
  <p>Invited email: {{ invite.email }}</p>
  <p>Role: {{ invite.role }}</p>
  <form method="post">
    <button class="btn btn-primary">Accept Invitation</button>
  </form>
</div>
{% endblock %}
