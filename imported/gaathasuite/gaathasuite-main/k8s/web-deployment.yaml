apiVersion: apps/v1
kind: Deployment
metadata:
  name: gaatha-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gaatha-web
  template:
    metadata:
      labels:
        app: gaatha-web
    spec:
      containers:
        - name: web
          image: gaatha:prod
          ports:
            - containerPort: 5000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gaatha-secrets
                  key: DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: gaatha-secrets
                  key: SECRET_KEY
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
