---
# Ansible playbook to distribute a local .env to target hosts and restart service
- hosts: gaatha_targets
  become: true
  vars:
    remote_env_path: /opt/gaatha/shared/.env
    local_env_src: ./.env
    service_name: gaatha

  tasks:
    - name: Copy .env to remote temp
      copy:
        src: "{{ local_env_src }}"
        dest: /tmp/gaatha.env.new
        mode: '0600'

    - name: Move .env into place
      command: mv /tmp/gaatha.env.new {{ remote_env_path }}

    - name: Ensure ownership
      file:
        path: "{{ remote_env_path }}"
        owner: gaatha
        group: gaatha
        mode: '0600'

    - name: Restart service
      systemd:
        name: "{{ service_name }}"
        state: restarted
