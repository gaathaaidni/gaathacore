services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentira
      POSTGRES_USER: sentira
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentira -d sentira"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:?set RABBITMQ_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks: [internal]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?set MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}"
    volumes:
      - minio_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    networks: [internal]
    healthcheck:
      test: ["CMD", "/mediamtx", "--version"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: "4000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: sentira
      DB_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      DB_NAME: sentira
      DB_SSL: "${DB_SSL:-false}"
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?set RABBITMQ_USER}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}@rabbitmq:5672/%2F
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:?set MINIO_ROOT_USER}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET}"
      CAMERA_CREDENTIAL_ENCRYPTION_KEY: "${CAMERA_CREDENTIAL_ENCRYPTION_KEY:?set CAMERA_CREDENTIAL_ENCRYPTION_KEY}"
      STREAM_GATEWAY_INTERNAL_TOKEN: "${STREAM_GATEWAY_INTERNAL_TOKEN:?set STREAM_GATEWAY_INTERNAL_TOKEN}"
      LEGAL_ENTITY_NAME: "${LEGAL_ENTITY_NAME:?set LEGAL_ENTITY_NAME}"
      LEGAL_ENTITY_ADDRESS: "${LEGAL_ENTITY_ADDRESS:?set LEGAL_ENTITY_ADDRESS}"
      PRIVACY_EMAIL: "${PRIVACY_EMAIL:?set PRIVACY_EMAIL}"
      DPO_EMAIL: "${DPO_EMAIL:?set DPO_EMAIL}"
      LEGAL_EMAIL: "${LEGAL_EMAIL:?set LEGAL_EMAIL}"
      SUPPORT_EMAIL: "${SUPPORT_EMAIL:?set SUPPORT_EMAIL}"
      GOVERNING_LAW: "${GOVERNING_LAW:?set GOVERNING_LAW}"
      JURISDICTION: "${JURISDICTION:?set JURISDICTION}"
      COMPANY_REGISTRATION: "${COMPANY_REGISTRATION:?set COMPANY_REGISTRATION}"
      CORS_ORIGINS: https://sentira.gaatha.tech
    expose: ["4000"]
    networks: [internal, edge]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15

  ai-worker:
    build:
      context: ./apps/ai-worker
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?set RABBITMQ_USER}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}@rabbitmq:5672/%2F
      AI_PROVIDER: "${AI_PROVIDER:-deterministic}"
      AI_WORKER_INGEST_TOKEN: "${AI_WORKER_INGEST_TOKEN:?set AI_WORKER_INGEST_TOKEN}"
    expose: ["8002"]
    networks: [internal]
    depends_on:
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  stream-gateway:
    build:
      context: ./apps/stream-gateway
    restart: unless-stopped
    environment:
      SENTIRA_API_URL: http://api:4000/api
      AI_WORKER_URL: http://ai-worker:8002
      MEDIAMTX_URL: http://mediamtx:8889
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      STREAM_GATEWAY_INTERNAL_TOKEN: "${STREAM_GATEWAY_INTERNAL_TOKEN:?set STREAM_GATEWAY_INTERNAL_TOKEN}"
      AI_WORKER_INGEST_TOKEN: "${AI_WORKER_INGEST_TOKEN:?set AI_WORKER_INGEST_TOKEN}"
      BUFFER_ROOT: /var/lib/sentira/buffer
    volumes:
      - stream_buffer:/var/lib/sentira/buffer
    expose: ["8001"]
    networks: [internal]
    depends_on:
      api: { condition: service_healthy }
      ai-worker: { condition: service_healthy }
      mediamtx: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://sentira.gaatha.tech/api
        NEXT_PUBLIC_WS_URL: https://sentira.gaatha.tech
    restart: unless-stopped
    expose: ["3000"]
    networks: [edge]

  reverse-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/sentira.gaatha.tech.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
    depends_on: [api, web]
    networks: [edge]

volumes:
  postgres_data: {}
  redis_data: {}
  rabbitmq_data: {}
  minio_data: {}
  stream_buffer: {}

networks:
  internal:
    internal: true
  edge: {}
