services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentira
      POSTGRES_USER: sentira
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-sentira_dev_password}"
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentira -d sentira"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
  mediamtx:
    image: bluenviron/mediamtx:latest
    command: ["/mediamtx.yml"]
    restart: unless-stopped
    ports: ["8554:8554", "8888:8888", "8889:8889"]
    volumes: ["./mediamtx.yml:/mediamtx.yml:ro"]
    healthcheck:
      # The upstream image has no shell or HTTP client; verify the native binary
      # can execute rather than invoking a missing /bin/sh.
      test: ["CMD", "/mediamtx", "--version"]
      interval: 10s
      timeout: 5s
      retries: 12
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      # Local Compose defaults only. Override every secret in a shared or production environment.
      NODE_ENV: development
      API_PORT: "4000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: sentira
      DB_PASSWORD: "${POSTGRES_PASSWORD:-sentira_dev_password}"
      DB_NAME: sentira
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-minioadmin}"

      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET}"
      CAMERA_CREDENTIAL_ENCRYPTION_KEY: "${CAMERA_CREDENTIAL_ENCRYPTION_KEY:?set CAMERA_CREDENTIAL_ENCRYPTION_KEY}"
      STREAM_GATEWAY_INTERNAL_TOKEN: "${STREAM_GATEWAY_INTERNAL_TOKEN:?set STREAM_GATEWAY_INTERNAL_TOKEN}"
      STREAM_GATEWAY_AUTH_SECRET: "${STREAM_GATEWAY_AUTH_SECRET:?set STREAM_GATEWAY_AUTH_SECRET}"
      SENTIRA_FIXTURE_PUBLISH_TOKEN: "${SENTIRA_FIXTURE_PUBLISH_TOKEN:-local-fixture-publisher-token}"
      CORS_ORIGINS: http://localhost:3000
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15
  ai-worker:
    build:
      context: ./apps/ai-worker
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      AI_PROVIDER: deterministic
      AI_WORKER_INGEST_TOKEN: "${AI_WORKER_INGEST_TOKEN:?set AI_WORKER_INGEST_TOKEN}"
      AI_MAX_FRAME_BYTES: "${AI_MAX_FRAME_BYTES:-10485760}"
    depends_on:
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
  stream-gateway:
    build:
      context: ./apps/stream-gateway
    restart: unless-stopped
    environment:
      SENTIRA_API_URL: http://api:4000/api
      AI_WORKER_URL: http://ai-worker:8002
      MEDIAMTX_URL: http://mediamtx:8889
      REDIS_URL: redis://redis:6379
      STREAM_GATEWAY_INTERNAL_TOKEN: "${STREAM_GATEWAY_INTERNAL_TOKEN:?set STREAM_GATEWAY_INTERNAL_TOKEN}"
      STREAM_GATEWAY_AUTH_SECRET: "${STREAM_GATEWAY_AUTH_SECRET:?set STREAM_GATEWAY_AUTH_SECRET}"
      AI_WORKER_INGEST_TOKEN: "${AI_WORKER_INGEST_TOKEN:?set AI_WORKER_INGEST_TOKEN}"
      SENTIRA_MEDIA_PUBLISH_TOKEN: "${SENTIRA_FIXTURE_PUBLISH_TOKEN:-local-fixture-publisher-token}"
      MEDIAMTX_RTSP_URL: rtsp://mediamtx:8554
      BUFFER_ROOT: /var/lib/sentira/buffer
    volumes: [stream_buffer:/var/lib/sentira/buffer]
    ports: ["8001:8001"]
    depends_on:
      api: { condition: service_healthy }
      ai-worker: { condition: service_healthy }
      mediamtx: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
  rtsp-fixture:
    build:
      context: ./apps/stream-gateway
    command: ["python", "fixture_publisher.py", "--host", "mediamtx", "--organization-id", "fixture-org", "--site-id", "fixture-site", "--camera-id", "fixture-camera"]
    environment:
      SENTIRA_MEDIA_PUBLISH_TOKEN: "${SENTIRA_FIXTURE_PUBLISH_TOKEN:-local-fixture-publisher-token}"
    restart: unless-stopped
    depends_on:
      mediamtx: { condition: service_healthy }
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api
        NEXT_PUBLIC_WS_URL: http://localhost:4000
    restart: unless-stopped
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15
volumes:
  postgres_data: {}
  minio_data: {}
  stream_buffer: {}
